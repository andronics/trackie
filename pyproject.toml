[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackie"
version = "0.1.0"
description = "Scrapes private tracker stats (IPTorrents, TorrentDay) and serves them as a JSON snapshot"
readme = "README.md"
authors = [
    {name = "andronics"},
]
license = {text = "Unlicense"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "PyYAML>=6.0.2",
    "Flask>=3.0.0",
    "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "requests-mock>=1.11.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.12",
]

[project.urls]
Repository = "https://github.com/andronics/trackie"
Issues = "https://github.com/andronics/trackie/issues"
Changelog = "https://github.com/andronics/trackie/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=trackie",
    "--cov-report=term-missing",
]
markers = [
    "live: hits a real tracker site (never run in CI)",
]

# coverage configuration
[tool.coverage.run]
source = ["src/trackie"]
omit = [
    "*/__init__.py",
    "*/__version__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# black configuration
[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

# ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

# mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
