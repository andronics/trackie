[project]
name = "trackie"
# Owned by release-please: never edit by hand (see the wiki's Release-Process page).
version = "0.1.0"
description = "Scrapes private tracker stats (IPTorrents, TorrentDay) and serves them as a JSON snapshot"
readme = "README.md"
requires-python = ">=3.13"
license = "Unlicense"
dependencies = [
    "interpose @ git+https://github.com/metalayerlab/interpose@v0.2.0",
    "pyyaml>=6.0",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # Fetching and parsing the trackers' pages, and the *arr and qBittorrent APIs
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
trackie = "trackie.cli:main"

[project.urls]
Homepage = "https://github.com/andronics/trackie"
Documentation = "https://github.com/andronics/trackie/wiki"
Changelog = "https://github.com/andronics/trackie/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-pyyaml",
    "httpx2>=2.0",
    "requests-mock>=1.11",
    "types-requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackie"]

[tool.hatch.metadata]
# interpose is pinned by its git URL, not PyPI (template-python decision 0003)
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; scripts print, and run git, by design.
"tests/*" = ["S101"]
"scripts/*" = ["T20", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src/trackie", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --cov --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
markers = ["integration: talks to real external systems; deselect with -m 'not integration'"]
# A deprecation fails the dependency bump that brings it, not a later run.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["trackie"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
