[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackie"
version = "0.1.0"
description = "Scrapes private tracker stats (IPTorrents, TorrentDay) and serves them as a JSON snapshot"
readme = "README.md"
authors = [
    {name = "andronics"},
]
license = {text = "Unlicense"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "PyYAML>=6.0.2",
    "Flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
