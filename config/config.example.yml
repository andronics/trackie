# trackie configuration: copy to /config/config.yml.
#
# Every setting can also be set by environment variable, and every variable
# has a _FILE variant that reads the value from a file (Docker secrets).
# Order: VAR_FILE, VAR, this file, built-in default.
#
# Cookies are secrets. Keep them out of this file and supply them as
#   TRACKIE_IPT_COOKIE_FILE=/run/secrets/ipt_cookie
#   TRACKIE_TD_COOKIE_FILE=/run/secrets/td_cookie
# (copy the Cookie header from a logged-in browser session).

http:
  timeout: 30                # seconds per request (TRACKIE_TIMEOUT)

poll:
  interval: 2700             # seconds between fetches per tracker, min 600 (TRACKIE_POLL_INTERVAL)
  jitter: 600                # up to this many seconds added at random (TRACKIE_POLL_JITTER)
  max_backoff: 21600         # after failures the interval doubles, up to this (TRACKIE_MAX_BACKOFF)

# Last good data per tracker, kept across restarts (TRACKIE_STATE_DIR)
state_dir: /config/state

trackers:
  ipt:
    enabled: true            # TRACKIE_IPT_ENABLED
    base_url: https://iptorrents.com
    # user_agent: "..."      # TRACKIE_IPT_USER_AGENT; defaults to a desktop Chrome UA
    # user_id: 1000000       # read from the site when not set
    request_gap: 5           # minimum seconds between requests to this site
    # Site rules (IPT H&R rules, 2026-10-20)
    hnr_limit: 40            # H&R torrents allowed before a warning
    hnr_grace: 432000        # seconds unseeded before a torrent counts (120 h)
    min_ratio: 1.0
    # Hostnames in qBittorrent's tracker URLs that identify this site
    announce_hosts: []

  td:
    enabled: true            # TRACKIE_TD_ENABLED
    base_url: https://www.torrentday.com
    request_gap: 5
    # TD H&R rules, 2026-10-20
    hnr_limit: 40
    hnr_grace: 259200        # 72 h
    min_ratio: 0.3
    announce_hosts: []
